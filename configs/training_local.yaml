# NIDAR training configuration — LOCAL GPU (RTX 3050 6GB laptop, CUDA).
# Same regime as Colab (configs/training.yaml) but sized for 6 GB VRAM:
# imgsz 640 + batch 8 fit comfortably; if OOM occurs, drop batch to 4.
# Colab config keeps imgsz 960 for the final full-resolution run.
model:
  weights: yolo26n.pt
  fallback_weights: yolo11n.pt

data: datasets/processed/data.yaml

train:
  epochs: 100
  imgsz: 640
  batch: 8
  patience: 20
  project: runs
  name: nidar_survivor_local
  seed: 42
  device: 0
  workers: 2
  val: true
  save_period: 10

augment:
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3
  degrees: 15.0
  translate: 0.1
  scale: 0.3
  shear: 2.0
  fliplr: 0.5
  flipud: 0.2
  mosaic: 0.5
  mixup: 0.0
  copy_paste: 0.1
